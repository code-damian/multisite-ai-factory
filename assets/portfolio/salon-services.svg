<rect x="60" y="55" width="1320" height="790" rx="30" fill="#fbf7f4" stroke="none" stroke-width="0"/><text x="100" y="115" font-family="Arial, sans-serif" font-size="42" fill="#3d2924" font-weight="800" text-anchor="start">USŁUGI I CENNIK</text><text x="100" y="155" font-family="Arial, sans-serif" font-size="18" fill="#80685f" font-weight="400" text-anchor="start">Wybierz usługę. Resztą zajmiemy się na miejscu.</text><rect x="100" y="205" width="390" height="535" rx="24" fill="#2b2023" stroke="none" stroke-width="0"/><text x="135" y="255" font-family="Arial, sans-serif" font-size="13" fill="#f4c982" font-weight="800" text-anchor="start">PAKIET</text><text x="135" y="305" font-family="Arial, sans-serif" font-size="38" fill="#fff" font-weight="800" text-anchor="start">Bella Signature</text><text x="135" y="350" font-family="Arial, sans-serif" font-size="18" fill="#d6c6c8" font-weight="400" text-anchor="start">Pełna metamorfoza</text><text x="135" y="405" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="400" text-anchor="start">• konsultacja</text><text x="135" y="440" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="400" text-anchor="start">• koloryzacja</text><text x="135" y="475" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="400" text-anchor="start">• pielęgnacja</text><text x="135" y="510" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="400" text-anchor="start">• stylizacja</text><text x="135" y="620" font-family="Arial, sans-serif" font-size="30" fill="#f4c982" font-weight="800" text-anchor="start">od 420 zł</text><rect x="135" y="660" width="190" height="48" rx="12" fill="#f4c982" stroke="none" stroke-width="0"/><text x="230" y="691" font-family="Arial, sans-serif" font-size="13" fill="#2b2023" font-weight="800" text-anchor="middle">REZERWUJ</text><rect x="535" y="205" width="380" height="245" rx="22" fill="#efe0d8" stroke="none" stroke-width="0"/><text x="570" y="255" font-family="Arial, sans-serif" font-size="25" fill="#3d2924" font-weight="800" text-anchor="start">Koloryzacja</text><text x="570" y="295" font-family="Arial, sans-serif" font-size="16" fill="#725d55" font-weight="400" text-anchor="start">Kolor dopasowany do karnacji</text><text x="850" y="335" font-family="Arial, sans-serif" font-size="20" fill="#6e4b42" font-weight="800" text-anchor="end">od 220 zł</text><rect x="955" y="205" width="380" height="245" rx="22" fill="#e6edf2" stroke="none" stroke-width="0"/><text x="990" y="255" font-family="Arial, sans-serif" font-size="25" fill="#263447" font-weight="800" text-anchor="start">Pielęgnacja</text><text x="990" y="295" font-family="Arial, sans-serif" font-size="16" fill="#65758b" font-weight="400" text-anchor="start">Regeneracja i połysk włosów</text><text x="1290" y="335" font-family="Arial, sans-serif" font-size="20" fill="#263447" font-weight="800" text-anchor="end">od 160 zł</text><rect x="535" y="480" width="800" height="260" rx="22" fill="#fff" stroke="#e7ddd7" stroke-width="2"/><text x="570" y="530" font-family="Arial, sans-serif" font-size="24" fill="#3d2924" font-weight="800" text-anchor="start">Jak wygląda wizyta?</text><text x="570" y="585" font-family="Arial, sans-serif" font-size="17" fill="#6e4b42" font-weight="800" text-anchor="start">01  Konsultacja</text><text x="790" y="585" font-family="Arial, sans-serif" font-size="17" fill="#6e4b42" font-weight="800" text-anchor="start">02  Usługa</text><text x="1010" y="585" font-family="Arial, sans-serif" font-size="17" fill="#6e4b42" font-weight="800" text-anchor="start">03  Stylizacja</text><text x="570" y="630" font-family="Arial, sans-serif" font-size="14" fill="#7c6d67" font-weight="400" text-anchor="start">Poznajemy potrzeby i planujemy efekt.</text><text x="790" y="630" font-family="Arial, sans-serif" font-size="14" fill="#7c6d67" font-weight="400" text-anchor="start">Pracujemy na sprawdzonych produktach.</text><text x="1010" y="630" font-family="Arial, sans-serif" font-size="14" fill="#7c6d67" font-weight="400" text-anchor="start">Wychodzisz z instrukcją pielęgnacji.</text>
<text x="80" y="850" font-family="Arial, sans-serif" font-size="14" fill="#8fa0bd">Oferta · ceny · pakiety · szybka rezerwacja</text>
