zczelności</text><text x="430" y="620" font-family="Arial, sans-serif" font-size="19" fill="#ff3b4d" font-weight="900" text-anchor="end">od 220 zł</text><rect x="510" y="235" width="380" height="450" rx="20" fill="#152331" stroke="none" stroke-width="0"/><text x="550" y="280" font-family="Arial, sans-serif" font-size="14" fill="#ff3b4d" font-weight="900" text-anchor="start">CZĘŚCI</text><text x="550" y="325" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="900" text-anchor="start">Filtr oleju</text><text x="550" y="360" font-family="Arial, sans-serif" font-size="14" fill="#aebdca" font-weight="400" text-anchor="start">Bosch · dostępny</text><text x="840" y="360" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="800" text-anchor="end">49 zł</text><text x="550" y="425" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="900" text-anchor="start">Klocki hamulcowe</text><text x="550" y="460" font-family="Arial, sans-serif" font-size="14" fill="#aebdca" font-weight="400" text-anchor="start">ATE · 2–3 dni</text><text x="840" y="460" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="800" text-anchor="end">249 zł</text><text x="550" y="525" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="900" text-anchor="start">Olej silnikowy 5W30</text><text x="550" y="560" font-family="Arial, sans-serif" font-size="14" fill="#aebdca" font-weight="400" text-anchor="start">5 l · Motul</text><text x="840" y="560" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="800" text-anchor="end">189 zł</text><rect x="930" y="235" width="340" height="450" rx="20" fill="#ff3b4d" stroke="none" stroke-width="0"/><text x="970" y="285" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="800" text-anchor="start">NIE WIESZ, CZEGO</text><text x="970" y="325" font-family="Arial, sans-serif" font-size="31" fill="#fff" font-weight="900" text-anchor="start">POTRZEBUJESZ?</text><text x="970" y="385" font-family="Arial, sans-serif" font-size="18" fill="#ffe5e8" font-weight="400" text-anchor="start">Wyślij model auta.</text><text x="970" y="420" font-family="Arial, sans-serif" font-size="18" fill="#ffe5e8" font-weight="400" text-anchor="start">Dobierzemy usługę i</text><text x="970" y="455" font-family="Arial, sans-serif" font-size="18" fill="#ffe5e8" font-weight="400" text-anchor="start">przygotujemy wycenę.</text><rect x="970" y="530" width="220" height="48" rx="10" fill="#fff" stroke="none" stroke-width="0"/><text x="1080" y="561" font-family="Arial, sans-serif" font-size="12" fill="#152331" font-weight="900" text-anchor="middle">POPROŚ O WYCENĘ</text>
<text x="80" y="850" font-family="Arial, sans-serif" font-size="14" fill="#8fa0bd">Cennik · wyszukiwarka usług · części · szybka wycena</text>
